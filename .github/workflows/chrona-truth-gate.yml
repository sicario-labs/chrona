name: Chrona Truth Gate

on:
  workflow_call:
    inputs:
      cwd:
        description: Working directory of the repository to audit (defaults to repo root).
        required: false
        type: string
        default: .
      node-version:
        required: false
        type: string
        default: "22"
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  pull-requests: write
  issues: write

jobs:
  verify-truth:
    name: Chrona Truth Referee
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version || '22' }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Chrona CLI
        run: pnpm run build

      - name: Run Chrona CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node packages/cli/dist/index.js ci --changed origin/${{ github.base_ref }} --cwd "${{ inputs.cwd || '.' }}"
