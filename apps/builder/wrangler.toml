name = "chrona-builder"
main = "src/index.ts"
compatibility_date = "2024-05-29"
compatibility_flags = [ "nodejs_compat" ]

[[queues.consumers]]
queue = "build-queue"
max_batch_size = 1
max_batch_timeout = 5

[[r2_buckets]]
binding = "CHRONA_BUILDS"
bucket_name = "chrona-builds"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "chrona-vectors"
