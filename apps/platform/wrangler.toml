name = "chrona-platform"
pages_build_output_dir = "dist"
compatibility_date = "2024-05-29"

[[queues.producers]]
queue = "build-queue"
binding = "BUILD_QUEUE"

[[r2_buckets]]
binding = "CHRONA_BUILDS"
bucket_name = "chrona-builds"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "chrona-vectors"
